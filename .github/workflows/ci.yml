name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The repo root is the BootCamp monorepo; the platform lives in test-AI-select/.
    defaults:
      run:
        working-directory: test-AI-select
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test-AI-select/package-lock.json

      # --ignore-scripts skips the playwright browser download: the unit test suite is
      # vitest-only and never launches a browser, so the ~300MB Chromium install would
      # just slow every check down.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
