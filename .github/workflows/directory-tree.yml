name: Generate Directory Tree

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run it manually

jobs:
  generate-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tree and Update README
        run: |
          sudo apt-get install -y tree
          
          # Generate the tree structure
          TREE_OUTPUT=$(tree -I '.git|node_modules|.github')
          
          # Write it out to a file
          echo "## Project Structure" > project-structure.md
          echo "\`\`\`text" >> project-structure.md
          echo "$TREE_OUTPUT" >> project-structure.md
          echo "\`\`\`" >> project-structure.md

      - name: Upload Structure Artifact
        uses: actions/upload-artifact@v4
        with:
          name: directory-tree
          path: project-structure.md
