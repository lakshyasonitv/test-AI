- name: Checkout Repository
  uses: actions/checkout@v4

- name: Install Tree and Update README
  run: |
    sudo apt-get install -y tree
    
    # Generate the tree output
    TREE_OUTPUT=$(tree -I '.git|node_modules|.github')
    
    # Optional: If you want to overwrite a specific file or log it
    echo "## Project Structure" > project-structure.md
    echo "\`\`\`text" >> project-structure.md
    echo "$TREE_OUTPUT" >> project-structure.md
    echo "\`\`\`" >> project-structure.md
