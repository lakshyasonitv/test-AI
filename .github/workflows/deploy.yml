# .github/workflows/deploy.yml
# Replaces image.yml. On every push to main: build the image, push it to GHCR
# (tagged :<sha>, :v1 and :latest), roll it out to the Azure Container App,
# wait for the new revision to be ready, then hit /api/health.

name: Build and deploy testbench

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue them instead.
concurrency:
  group: deploy-testbench
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lakshyasonitv/testbench
  APP_NAME: testbench
  RESOURCE_GROUP: testbench-rg
  HEALTH_URL: https://testbench.livelysmoke-6ad5557f.koreacentral.azurecontainerapps.io/api/health

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:v1
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC login to Azure
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          # These are identifiers, not passwords. OIDC means no secret is stored anywhere.
          client-id: fd0a1f48-f7d2-4016-bb2c-938ac506e52e       # testbench-deploy app registration
          tenant-id: a1374a1f-c211-4545-b163-4ea56a9b0a51       # your Entra tenant
          subscription-id: 0abe35dc-0316-4937-ac49-82382d860687

      - name: Update container app
        run: |
          az containerapp update \
            -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}" \
            --set-env-vars DEPLOY_STAMP=${{ github.run_number }} \
            --output none
          echo "Deployed $IMAGE:${{ github.sha }} (DEPLOY_STAMP=${{ github.run_number }})"

      - name: Wait for new revision to become ready
        run: |
          rev=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query 'properties.latestRevisionName' -o tsv)
          echo "Waiting for revision $rev"
          for i in $(seq 1 30); do
            read -r prov health running <<< "$(az containerapp revision show \
              -n "$APP_NAME" -g "$RESOURCE_GROUP" --revision "$rev" \
              --query '[properties.provisioningState, properties.healthState, properties.runningState]' -o tsv)"
            echo "attempt $i: provisioning=$prov health=$health running=$running"
            case "$prov/$health/$running" in
              Provisioned/Unhealthy/*|Failed/*/*|*/*/Failed|*/*/Degraded)
                echo "::error::Revision $rev failed (provisioning=$prov health=$health running=$running)"
                exit 1 ;;
              Provisioned/Healthy/*|Provisioned/None/ScaledToZero|Provisioned/None/Running)
                echo "Revision $rev is ready"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::Revision $rev never became ready"
          exit 1

      - name: Health check
        run: |
          # minReplicas is 0, so the first request cold-starts the container (~60s).
          for i in $(seq 1 10); do
            code=$(curl -s -m 120 -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::Health check failed at $HEALTH_URL"
          exit 1