}}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid rgba(28,25,20,.06)\">\n                <span style=\"{{ h.pillStyle }}\">{{ h.status }}<\u002Fspan>\n                <div style=\"flex:1;min-width:200px\">\n                  <div style=\"font:500 12.5px system-ui;margin-bottom:3px\">{{ h.label }}<\u002Fdiv>\n                  <div style=\"font:11px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.5)\">{{ h.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:7px;flex:none\">\n                  <button sc-camel-on-click=\"{{ h.onOpen }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:6px 10px;font:11.5px system-ui;cursor:pointer\">View<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ h.onRerun }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:6px 10px;font:11.5px system-ui;cursor:pointer\">Re-run<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ h.onDelete }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:6px 10px;font:11.5px system-ui;color:#a8402c;cursor:pointer\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ historyEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:36px 16px;text-align:center;font:13px system-ui;color:rgba(28,25,20,.5)\">No runs recorded yet.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n  <\u002Fdiv>\n\n  <!-- ============ MODALS ============ -->\n  <sc-if value=\"{{ credOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(28,25,20,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60\">\n      <div style=\"width:100%;max-width:400px;background:#fff;border-radius:14px;border:1px solid rgba(28,25,20,.14);box-shadow:0 24px 60px -20px rgba(28,25,20,.5);padding:20px;animation:fadeUp .18s ease-out\">\n        <div style=\"font:600 14px system-ui;margin-bottom:6px\">This site needs a login<\u002Fdiv>\n        <div style=\"font:12px/1.6 system-ui;color:rgba(28,25,20,.6);margin-bottom:14px;text-wrap:pretty\">{{ credNote }}<\u002Fdiv>\n        <input value=\"{{ credUser }}\" sc-camel-on-change=\"{{ onCredUser }}\" placeholder=\"Username or email\" style=\"width:100%;height:35px;border:1px solid rgba(28,25,20,.14);border-radius:8px;padding:0 11px;font:12.5px system-ui;margin-bottom:9px\">\n        <input value=\"{{ credPass }}\" sc-camel-on-change=\"{{ onCredPass }}\" type=\"password\" placeholder=\"Password\" style=\"width:100%;height:35px;border:1px solid rgba(28,25,20,.14);border-radius:8px;padding:0 11px;font:12.5px system-ui\">\n        <div style=\"font:11px/1.5 system-ui;color:rgba(28,25,20,.45);margin:10px 0 14px\">Used for this run only. Never written to the run folder or the results history.<\u002Fdiv>\n        <div style=\"display:flex;gap:9px\">\n          <button sc-camel-on-click=\"{{ onCredSkip }}\" style=\"flex:1;height:34px;border:1px solid rgba(28,25,20,.16);background:#faf9f5;border-radius:8px;font:12px system-ui;cursor:pointer\">Skip — test without logging in<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onCredSubmit }}\" style=\"flex:none;height:34px;padding:0 15px;border:none;background:#b4552d;color:#fff;border-radius:8px;font:500 12px system-ui;cursor:pointer\">Use these<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ shotOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onCloseShot }}\" style=\"position:fixed;inset:0;background:rgba(28,25,20,.72);display:flex;align-items:center;justify-content:center;padding:28px;z-index:70;cursor:zoom-out\">\n      <div style=\"width:100%;max-width:900px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px\">\n          <span style=\"font:11.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(250,249,245,.8);flex:1\">{{ shotLabel }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ onCloseShot }}\" style=\"border:1px solid rgba(250,249,245,.3);background:transparent;color:#faf9f5;border-radius:7px;padding:5px 11px;font:11.5px system-ui;cursor:pointer\">Close<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"height:min(70vh,520px);border-radius:12px;background:repeating-linear-gradient(135deg,#d9d5c9 0 9px,#e6e2d6 9px 18px);border:1px solid rgba(250,249,245,.25);display:flex;align-items:center;justify-content:center;font:12px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.5)\">full-size screenshot<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#221f1a;color:#faf9f5;padding:10px 16px;border-radius:10px;font:12.5px system-ui;box-shadow:0 12px 30px -12px rgba(28,25,20,.6);z-index:80;animation:fadeUp .18s ease-out\">{{ toastText }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;gateReview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;selfHeal&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst ST = {\n  passed:   { label: 'Passed',      fg: '#2b6b48', bg: 'rgba(63,143,99,.13)',  dot: '#3f8f63' },\n  failed:   { label: 'Failed',      fg: '#8c3423', bg: 'rgba(168,64,44,.12)',  dot: '#c0492b' },\n  unconfirmed: { label: 'Unconfirmed', fg: '#7d6118', bg: 'rgba(176,138,38,.15)', dot: '#b08a26' },\n  blocked:  { label: 'Blocked',     fg: '#6b5340', bg: 'rgba(138,111,90,.14)', dot: '#8a6f5a' },\n  running:  { label: 'Running',     fg: '#8d3f1f', bg: 'rgba(180,85,45,.13)',  dot: '#b4552d' },\n  pending:  { label: 'Queued',      fg: '#6b665c', bg: 'rgba(28,25,20,.07)',   dot: '#c2bcae' },\n  draft:    { label: 'Not run yet', fg: '#6b665c', bg: 'rgba(28,25,20,.07)',   dot: '#c2bcae' }\n};\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.timers = [];\n    this.uid = 100;\n    const projects = this.seed();\n    this.state = {\n      projects,\n      view: 'home',\n      pid: 'p1', sid: null, cid: null,\n      expanded: { p1: true, s1: true },\n      prompt: '', url: 'staging.acme.shop/products/atlas-mug', coverage: 'standard',\n      tab: 'describe', saveP: 'p1', saveS: 's1',\n      picked: {}, suiteSel: {},\n      caseTab: 'steps', draft: null, askText: '',\n      run: null, runs: this.seedRuns(), elapsed: 0,\n      gateSel: {}, refineOpen: false, refineText: '',\n      cred: null, credUser: '', credPass: '',\n      shot: null, toast: null, expandedResult: null,\n      cmp: null, settingsOpen: false,\n      gateEnabled: props.gateReview ?? true, autoHeal: props.selfHeal ?? true,\n      search: '', sidebarOpen: false, width: 1440\n    };\n  }\n\n  /* ---------- data ---------- */\n  seed() {\n    const c = (id, title, why, expected, status, steps, extra) => Object.assign({\n      id, title, why, expected, status, steps, needsAuth: false, nextResult: status,\n      versions: [{ v: 1, ts: '3 weeks ago', author: 'AI', note: 'Generated from the original prompt', status: 'passed', steps: steps.slice() }],\n      runs: [{ id: id + '-r1', ts: '3 weeks ago', status: 'passed', v: 1, duration: '31s' }]\n    }, extra || {});\n\n    const promo = c('c2', 'Promo code rejects expired', 'An expired code that still applies a discount costs real margin on every order.',\n      'An inline error appears and the order total does not change.', 'failed',\n      ['Go to /cart with one item', 'Fill \"Promo code\" with SPRING24', 'Click button \"Apply\"', 'Assert text equals \"This code has expired\"', 'Assert discount row is hidden']);\n    promo.versions = [\n      { v: 1, ts: '3 weeks ago', author: 'AI', note: 'Generated from the original prompt', status: 'passed', steps: ['Go to /cart with one item', 'Fill \"Promo code\" with SPRING24', 'Click button \"Apply\"', 'Assert text contains \"expired\"'] },\n      { v: 2, ts: '6 days ago', author: 'Priya', note: 'Manual edit — waited for the totals block', status: 'failed', steps: ['Go to /cart with one item', 'Fill \"Promo code\" with SPRING24', 'Click button \"Apply\"', 'Wait for totals block', 'Assert text contains \"expired\"'] },\n      { v: 3, ts: '2 days ago', author: 'Self-heal', note: 'Selector re-anchored after the cart redesign', status: 'passed', steps: ['Go to /cart with one item', 'Fill \"Promo code\" with SPRING24', 'Click button \"Apply\"', 'Assert text contains \"expired\"'] },\n      { v: 4, ts: 'today, 09:42', author: 'you', note: 'Tightened step 4 to an exact match, added a discount-row check', status: 'failed', steps: promo.steps.slice() }\n    ];\n    promo.runs = [\n      { id: 'c2-r4', ts: 'today, 09:42', status: 'failed', v: 4, duration: '41s' },\n      { id: 'c2-r3', ts: '2 days ago', status: 'passed', v: 3, duration: '38s' },\n      { id: 'c2-r2', ts: '6 days ago', status: 'failed', v: 2, duration: '1m 02s' },\n      { id: 'c2-r1', ts: '3 weeks ago', status: 'passed', v: 1, duration: '33s' }\n    ];\n    promo.diag = {\n      title: 'The assertion did not hold',\n      text: 'The cart applied a 20% discount instead of showing an error, so \"This code has expired\" never appeared. This looks like a real regression in the promo service, not a flaky selector.',\n      meta: 'category: assertion_failed · step s4 · retried once'\n    };\n\n    const checkout = [\n      c('c1', 'Guest checkout, card payment', 'Most first-time buyers never create an account — if this path breaks, revenue stops.',\n        'The payment step loads with the correct order total.', 'passed',\n        ['Go to the product page', 'Click button \"Add to cart\"', 'Click link \"Checkout\"', 'Fill email with guest@example.com', 'Assert text contains \"Payment\"']),\n      promo,\n      c('c3', 'Cart survives page reload', 'Shoppers refresh constantly; an emptied cart reads as a lost order.',\n        'The cart still lists the item after a reload.', 'passed',\n        ['Go to the product page', 'Click button \"Add to cart\"', 'Reload the page', 'Assert cart count equals \"1\"']),\n      c('c4', 'Shipping estimate updates', 'A wrong estimate at checkout is the top driver of abandoned carts.',\n        'The shipping line changes when the postcode changes.', 'unconfirmed',\n        ['Go to /cart', 'Fill postcode with 94107', 'Click button \"Update\"', 'Assert shipping line is visible'])\n    ];\n\n    const auth = [\n      c('c5', 'Sign in with the wrong password', 'A login that lets bad credentials through is a security incident.',\n        'An error appears and no session is created.', 'passed',\n        ['Go to /login', 'Fill email with user@example.com', 'Fill password with wrong-pass', 'Click button \"Sign in\"', 'Assert text contains \"incorrect\"'], { needsAuth: true }),\n      c('c6', 'Password reset sends an email', 'Users locked out of accounts churn within a day.',\n        'A confirmation notice appears after submitting.', 'passed',\n        ['Go to /login', 'Click link \"Forgot password\"', 'Fill email with user@example.com', 'Click button \"Send link\"', 'Assert text contains \"Check your inbox\"'], { needsAuth: true }),\n      c('c7', 'Session ends after logout', 'A live session after logout on a shared machine is a privacy failure.',\n        'Visiting the account page redirects to login.', 'unconfirmed',\n        ['Go to /account', 'Click button \"Log out\"', 'Go to /account', 'Assert url contains \"/login\"'], { needsAuth: true })\n    ];\n\n    const search = [\n      c('c8', 'Search returns relevant results', 'If search is broken, customers cannot find products they already want.',\n        'At least one result matches the query.', 'passed',\n        ['Go to the homepage', 'Fill search with \"mug\"', 'Press Enter', 'Assert results list is visible']),\n      c('c9', 'Category filter narrows results', 'Filters are how people shop large catalogues.',\n        'Only items in the chosen category remain.', 'passed',\n        ['Go to /shop', 'Click checkbox \"Drinkware\"', 'Assert result count decreases'])\n    ];\n\n    return [\n      { id: 'p1', name: 'Acme Storefront', url: 'staging.acme.shop', suites: [\n        { id: 's1', name: 'Checkout suite', cases: checkout },\n        { id: 's2', name: 'Auth & accounts', cases: auth },\n        { id: 's3', name: 'Search & browse', cases: search }\n      ] },\n      { id: 'p2', name: 'Internal Admin', url: 'admin.acme.internal', suites: [\n        { id: 's4', name: 'Roles & permissions', cases: [\n          c('c10', 'Editor cannot delete users', 'Over-broad permissions are how accidents become outages.',\n            'The delete action is not available to an editor.', 'passed',\n            ['Go to /admin/users', 'Assert button \"Delete\" is hidden'])\n        ] }\n      ] },\n      { id: 'p3', name: 'Marketing site', url: 'acme.com', suites: [\n        { id: 's5', name: 'Lead forms', cases: [\n          c('c11', 'Contact form validates email', 'Bad leads waste the sales team\\u2019s week.',\n            'An inline error appears for a malformed address.', 'passed',\n            ['Go to /contact', 'Fill email with \"not-an-email\"', 'Click button \"Send\"', 'Assert text contains \"valid email\"'])\n        ] }\n      ] }\n    ];\n  }\n\n  seedRuns() {\n    return [\n      { id: 'r-901', label: 'Checkout suite', scope: 'suite', status: 'failed', ts: '2 hours ago', meta: '10/12 passed · 3m 04s · v4', pid: 'p1', sid: 's1' },\n      { id: 'r-900', label: 'Auth & accounts', scope: 'suite', status: 'passed', ts: 'yesterday', meta: '8/9 passed · 2m 41s', pid: 'p1', sid: 's2' },\n      { id: 'r-899', label: 'Search returns relevant results', scope: 'case', status: 'passed', ts: '3 days ago', meta: '1/1 passed · 26s', pid: 'p1', sid: 's3' }\n    ];\n  }\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ width: window.innerWidth });\n    window.addEventListener('resize', this.onResize);\n    this.onKey = (e) => { if (e.key === 'Escape') this.setState({ shot: null, settingsOpen: false }); };\n    window.addEventListener('keydown', this.onKey);\n    this.setState({ width: window.innerWidth });\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('keydown', this.onKey);\n    this.clearTimers();\n  }\n\n  /* ---------- helpers ---------- */\n  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; if (this.tick) { clearInterval(this.tick); this.tick = null; } }\n  after(ms, fn) { this.timers.push(setTimeout(fn, ms)); }\n  clip(s, n) {\n    const t = (s || '').trim();\n    if (t.length <= n) return t;\n    const cut = t.slice(0, n);\n    const sp = cut.lastIndexOf(' ');\n    return (sp > n * 0.5 ? cut.slice(0, sp) : cut).replace(/[,;:.\\s]+$/, '') + '…';\n  }\n  toast(msg) { if (this.tt) clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: null }), 2400); }\n  pill(status) {\n    const s = ST[status] || ST.pending;\n    return { label: s.label, style: { padding: '2px 8px', borderRadius: 20, background: s.bg, color: s.fg, font: '600 9.5px \"JetBrains Mono\",ui-monospace,monospace', letterSpacing: '.04em', flex: 'none', whiteSpace: 'nowrap' } };\n  }\n  dot(status, size) {\n    const s = ST[status] || ST.pending;\n    return { width: size || 7, height: size || 7, borderRadius: '50%', background: s.dot, flex: 'none', display: 'inline-block' };\n  }\n  proj(id) { return this.state.projects.find(p => p.id === (id || this.state.pid)); }\n  suite(id) { let out = null; this.state.projects.forEach(p => p.suites.forEach(s => { if (s.id === id) out = s; })); return out; }\n  findCase(id) {\n    let out = null;\n    this.state.projects.forEach(p => p.suites.forEach(s => s.cases.forEach(c => { if (c.id === id) out = { c, s, p }; })));\n    return out;\n  }\n  updateCase(id, fn) {\n    this.setState(st => ({\n      projects: st.projects.map(p => ({ ...p, suites: p.suites.map(s => ({ ...s, cases: s.cases.map(c => c.id === id ? fn({ ...c }) : c) })) }))\n    }));\n  }\n  currentSteps() {\n    const d = this.state.draft;\n    if (d && d.cid === this.state.cid) return d.steps;\n    const f = this.findCase(this.state.cid);\n    return f ? f.c.steps : [];\n  }\n  setDraft(steps, expected) {\n    const f = this.findCase(this.state.cid);\n    this.setState({ draft: { cid: this.state.cid, steps, expected: expected !== undefined ? expected : (this.state.draft && this.state.draft.cid === this.state.cid ? this.state.draft.expected : (f ? f.c.expected : '')) } });\n  }\n  scriptFor(title, steps, base) {\n    const body = steps.map(s => {\n      const t = s.trim();\n      if (/^go to/i.test(t)) return \"  await page.goto('\" + base + t.replace(/^go to\\s*/i, '').replace(/^the\\s+/i, '/') + \"');\";\n      if (/^fill/i.test(t)) { const m = t.match(/\"([^\"]+)\"/); const v = t.split(' with ')[1] || ''; return \"  await page.getByLabel('\" + (m ? m[1] : 'field') + \"').fill(\" + JSON.stringify(v.replace(/^\"|\"$/g, '')) + \");\"; }\n      if (/^click/i.test(t)) { const m = t.match(/\"([^\"]+)\"/); const role = /link/i.test(t) ? 'link' : /checkbox/i.test(t) ? 'checkbox' : 'button'; return \"  await page.getByRole('\" + role + \"', { name: '\" + (m ? m[1] : 'action') + \"' }).click();\"; }\n      if (/^press/i.test(t)) return \"  await page.keyboard.press('\" + t.replace(/^press\\s*/i, '') + \"');\";\n      if (/^reload/i.test(t)) return '  await page.reload();';\n      if (/^wait/i.test(t)) return \"  await page.waitForLoadState('networkidle');\";\n      if (/^assert/i.test(t)) {\n        const m = t.match(/\"([^\"]+)\"/);\n        if (/hidden/i.test(t)) return \"  await expect(page.getByTestId('discount-row')).toBeHidden();\";\n        if (/url contains/i.test(t)) return \"  await expect(page).toHaveURL(/\" + (m ? m[1].replace(/\\//g, '\\\\/') : '') + \"/);\";\n        if (m) return \"  await expect(page.getByText('\" + m[1] + \"')).toBeVisible();\";\n        return '  await expect(page.locator(\\'[data-test=\"results\"]\\')).toBeVisible();';\n      }\n      return '  // ' + t;\n    }).join('\\n');\n    return \"import { test, expect } from '@playwright/test';\\n\\ntest(\" + JSON.stringify(title) + \", async ({ page }) => {\\n\" + body + \"\\n});\\n\";\n  }\n\n  /* ---------- navigation ---------- */\n  go(patch) { this.setState(Object.assign({ sidebarOpen: false, settingsOpen: false }, patch)); }\n  openProject(id) {\n    this.setState(st => ({ pid: id, sid: null, cid: null, view: 'home', saveP: id, saveS: (this.proj(id).suites[0] || {}).id, expanded: { ...st.expanded, [id]: !st.expanded[id] }, sidebarOpen: false }));\n  }\n  openSuite(sid) {\n    const f = this.state.projects.find(p => p.suites.some(s => s.id === sid));\n    this.setState(st => ({ pid: f.id, sid, cid: null, view: 'suite', suiteSel: {}, expanded: { ...st.expanded, [f.id]: true, [sid]: !st.expanded[sid] }, sidebarOpen: false, settingsOpen: false }));\n  }\n  openCase(cid) {\n    const f = this.findCase(cid);\n    if (!f) return;\n    this.setState(st => ({ pid: f.p.id, sid: f.s.id, cid, view: 'case', caseTab: 'steps', draft: null, askText: '', expanded: { ...st.expanded, [f.p.id]: true, [f.s.id]: true }, sidebarOpen: false, settingsOpen: false }));\n  }\n\n  /* ---------- CRUD ---------- */\n  addProject() {\n    const id = 'p' + (++this.uid);\n    const sid = 's' + (++this.uid);\n    this.setState(st => ({ projects: st.projects.concat([{ id, name: 'Untitled project', url: 'example.com', suites: [{ id: sid, name: 'First suite', cases: [] }] }]), pid: id, sid: null, view: 'home', expanded: { ...st.expanded, [id]: true } }));\n    this.toast('Project created — rename it from its suite screen');\n  }\n  addSuite(pid) {\n    const id = 's' + (++this.uid);\n    this.setState(st => ({ projects: st.projects.map(p => p.id === pid ? { ...p, suites: p.suites.concat([{ id, name: 'Untitled suite', cases: [] }]) } : p), expanded: { ...st.expanded, [pid]: true } }));\n    this.after(0, () => this.openSuite(id));\n    this.toast('Suite created');\n  }\n  addCase(sid) {\n    const id = 'c' + (++this.uid);\n    const nc = {\n      id, title: 'Untitled test case', why: 'Say why this matters so results read clearly later.',\n      expected: 'Describe what should happen.', status: 'draft', nextResult: 'passed', needsAuth: false,\n      steps: ['Go to the homepage'],\n      versions: [{ v: 1, ts: 'just now', author: 'you', note: 'Created by hand', status: 'draft', steps: ['Go to the homepage'] }],\n      runs: []\n    };\n    this.setState(st => ({ projects: st.projects.map(p => ({ ...p, suites: p.suites.map(s => s.id === sid ? { ...s, cases: s.cases.concat([nc]) } : s) })) }));\n    this.after(0, () => this.openCase(id));\n  }\n  dupCase(cid) {\n    const f = this.findCase(cid);\n    const id = 'c' + (++this.uid);\n    const copy = JSON.parse(JSON.stringify(f.c));\n    copy.id = id; copy.title = f.c.title + ' (copy)'; copy.status = 'draft'; copy.runs = [];\n    copy.versions = [{ v: 1, ts: 'just now', author: 'you', note: 'Duplicated from ' + f.c.title, status: 'draft', steps: f.c.steps.slice() }];\n    this.setState(st => ({ projects: st.projects.map(p => ({ ...p, suites: p.suites.map(s => s.id === f.s.id ? { ...s, cases: s.cases.concat([copy]) }
