document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

none\">\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"width:22px;height:22px;border-radius:6px;background:#221f1a;display:flex;align-items:center;justify-content:center;color:#faf9f5;font:600 11px 'JetBrains Mono',ui-monospace,monospace;flex:none\">T<\u002Fdiv>\n        <div style=\"font:600 13px system-ui,sans-serif;letter-spacing:-.01em;flex:1\">Testbench<\u002Fdiv>\n        <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ closeSidebar }}\" style=\"border:none;background:transparent;font:16px system-ui;color:rgba(28,25,20,.45);cursor:pointer;padding:0 2px\">×<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onNewRun }}\" style=\"height:34px;border:none;border-radius:9px;background:#221f1a;color:#faf9f5;font:500 12.5px system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px\" style-hover=\"{{ hoverDark }}\">+ New run<\u002Fbutton>\n      <input value=\"{{ search }}\" sc-camel-on-change=\"{{ onSearch }}\" placeholder=\"Search projects, cases…\" style=\"height:31px;border-radius:8px;background:#faf9f5;border:1px solid rgba(28,25,20,.12);padding:0 10px;font-size:12px;width:100%\">\n    <\u002Fdiv>\n\n    <div style=\"flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:2px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:6px 8px 5px\">\n        <span style=\"font:600 9.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.09em;color:rgba(28,25,20,.42)\">PROJECTS<\u002Fspan>\n        <button sc-camel-on-click=\"{{ onAddProject }}\" title=\"New project\" style=\"border:none;background:transparent;font:15px system-ui;line-height:1;color:rgba(28,25,20,.45);cursor:pointer;padding:0 3px\">+<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ treeRows }}\" as=\"row\" hint-placeholder-count=\"9\">\n        <div sc-camel-on-click=\"{{ row.onClick }}\" style=\"{{ row.style }}\" style-hover=\"{{ row.hoverStyle }}\">\n          <sc-if value=\"{{ row.hasChevron }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"font-size:9px;width:9px;flex:none;color:rgba(28,25,20,.5)\">{{ row.chevron }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ row.hasDot }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"{{ row.dotStyle }}\"><\u002Fspan>\n          <\u002Fsc-if>\n          <span style=\"{{ row.labelStyle }}\">{{ row.label }}<\u002Fspan>\n          <sc-if value=\"{{ row.hasCount }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font:10px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.4);flex:none\">{{ row.count }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"flex:none;padding:12px 16px 14px;border-top:1px solid rgba(28,25,20,.09);display:flex;flex-direction:column;gap:9px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between\">\n        <span style=\"font:600 9.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.09em;color:rgba(28,25,20,.42)\">RECENT RUNS<\u002Fspan>\n        <button sc-camel-on-click=\"{{ onHistory }}\" style=\"border:none;background:transparent;font:11px system-ui;color:#b4552d;cursor:pointer;padding:0\">All<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ recent }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div sc-camel-on-click=\"{{ r.onClick }}\" style=\"display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 0\" style-hover=\"{{ hoverText }}\">\n          <span style=\"{{ r.dotStyle }}\"><\u002Fspan>\n          <span style=\"font:11.5px system-ui,sans-serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(28,25,20,.8)\">{{ r.label }}<\u002Fspan>\n          <span style=\"font:10px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.42);flex:none\">{{ r.meta }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ noRecent }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"font:11.5px system-ui,sans-serif;color:rgba(28,25,20,.4)\">No runs yet — start one above.<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n\n    <header style=\"height:52px;flex:none;border-bottom:1px solid rgba(28,25,20,.09);display:flex;align-items:center;gap:10px;padding:0 16px;background:#faf9f5;position:sticky;top:0;z-index:20\">\n      <sc-if value=\"{{ narrow }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ openSidebar }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#fff;border-radius:8px;height:32px;padding:0 10px;font:13px system-ui;cursor:pointer\">☰<\u002Fbutton>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:center;gap:8px;min-width:0;flex:1\">\n        <button sc-camel-on-click=\"{{ onHome }}\" style=\"border:none;padding:4px 9px;border-radius:6px;background:rgba(28,25,20,.06);font:500 12.5px system-ui,sans-serif;cursor:pointer\">{{ crumbProject }}<\u002Fbutton>\n        <sc-if value=\"{{ hasCrumb2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"color:rgba(28,25,20,.3);font-size:12px\">/<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasCrumb2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onCrumb2 }}\" style=\"border:none;background:transparent;font:12.5px system-ui,sans-serif;color:rgba(28,25,20,.6);cursor:pointer;padding:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px\">{{ crumb2 }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasCrumb3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"color:rgba(28,25,20,.3);font-size:12px\">/<\u002Fspan>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasCrumb3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font:500 12.5px system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px\">{{ crumb3 }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;flex:none;position:relative\">\n        <button sc-camel-on-click=\"{{ onHistory }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#fff;border-radius:8px;height:31px;padding:0 11px;font:12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">History<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onToggleSettings }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#fff;border-radius:8px;height:31px;padding:0 11px;font:12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Settings<\u002Fbutton>\n        <sc-if value=\"{{ settingsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:38px;right:0;width:272px;background:#fff;border:1px solid rgba(28,25,20,.14);border-radius:12px;box-shadow:0 12px 30px -12px rgba(28,25,20,.3);padding:14px;z-index:30;animation:fadeUp .16s ease-out\">\n            <div style=\"font:600 11px system-ui;margin-bottom:11px\">Run behaviour<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ onToggleGate }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0\">\n              <div style=\"{{ gateTrack }}\"><div style=\"{{ gateKnob }}\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1\">\n                <div style=\"font:12px system-ui\">Review cases before running<\u002Fdiv>\n                <div style=\"font:11px/1.4 system-ui;color:rgba(28,25,20,.5)\">Pause to approve the AI's test cases<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ onToggleHeal }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0\">\n              <div style=\"{{ healTrack }}\"><div style=\"{{ healKnob }}\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1\">\n                <div style=\"font:12px system-ui\">Self-heal broken selectors<\u002Fdiv>\n                <div style=\"font:11px/1.4 system-ui;color:rgba(28,25,20,.5)\">Retry once after re-reading the page<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <main style=\"{{ mainStyle }}\">\n\n      <!-- ---------- HOME ---------- -->\n      <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"{{ colStyle }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <h1 style=\"margin:0;font:400 34px/1.15 'Newsreader',Georgia,serif;letter-spacing:-.01em\">What should we test today?<\u002Fh1>\n            <p style=\"margin:0;font:13.5px/1.6 system-ui,sans-serif;color:rgba(28,25,20,.55);max-width:560px;text-wrap:pretty\">Describe it in plain English and point it at a URL — or run the cases this project already has.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:22px;border-bottom:1px solid rgba(28,25,20,.1)\">\n            <button sc-camel-on-click=\"{{ onTabDescribe }}\" style=\"{{ tabDescribeStyle }}\">Describe a test<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onTabExisting }}\" style=\"{{ tabExistingStyle }}\">Run existing cases<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ tabIsDescribe }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff;border:1px solid rgba(28,25,20,.12);border-radius:14px;box-shadow:0 1px 2px rgba(28,25,20,.04),0 8px 24px -14px rgba(28,25,20,.18);overflow:hidden\">\n              <textarea value=\"{{ prompt }}\" sc-camel-on-change=\"{{ onPrompt }}\" placeholder=\"Check that a guest can add a product to the cart, apply the promo code SPRING24, and reach the payment step without signing in.\" style=\"width:100%;min-height:96px;border:none;resize:vertical;padding:17px 19px 8px;font:14.5px/1.6 system-ui,sans-serif;background:transparent\"><\u002Ftextarea>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 13px 10px 19px;border-top:1px solid rgba(28,25,20,.07)\">\n                <div style=\"flex:1;min-width:220px;display:flex;align-items:center;gap:7px;height:34px;border:1px solid rgba(28,25,20,.13);border-radius:9px;padding:0 11px;background:#faf9f5\">\n                  <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.4);flex:none\">https://<\u002Fspan>\n                  <input value=\"{{ url }}\" sc-camel-on-change=\"{{ onUrl }}\" placeholder=\"example.com/page\" style=\"flex:1;min-width:0;border:none;background:transparent;font:12.5px 'JetBrains Mono',ui-monospace,monospace\">\n                <\u002Fdiv>\n                <div style=\"display:flex;height:34px;background:rgba(28,25,20,.06);border-radius:9px;padding:3px;gap:2px;flex:none\">\n                  <button sc-camel-on-click=\"{{ onCovMin }}\" style=\"{{ covMinStyle }}\">Minimal<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onCovStd }}\" style=\"{{ covStdStyle }}\">Standard<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ onCovFull }}\" style=\"{{ covFullStyle }}\">Full<\u002Fbutton>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ onRunPrompt }}\" style=\"height:34px;padding:0 16px;border:none;border-radius:9px;background:#b4552d;color:#fff;font:500 12.5px system-ui,sans-serif;cursor:pointer;flex:none\" style-hover=\"{{ hoverAccent }}\">▸ Run test<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:11px 19px;background:#f7f5ef;border-top:1px solid rgba(28,25,20,.07)\">\n                <span style=\"font:11.5px system-ui,sans-serif;color:rgba(28,25,20,.5)\">Save the script to<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onCycleProject }}\" style=\"padding:4px 9px;border-radius:6px;background:#fff;border:1px solid rgba(28,25,20,.13);font:500 11.5px system-ui,sans-serif;cursor:pointer\" style-hover=\"{{ hoverLight }}\">{{ saveProjectName }} ▾<\u002Fbutton>\n                <span style=\"font:11px system-ui,sans-serif;color:rgba(28,25,20,.35)\">/<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onCycleSuite }}\" style=\"padding:4px 9px;border-radius:6px;background:#fff;border:1px solid rgba(28,25,20,.13);font:500 11.5px system-ui,sans-serif;cursor:pointer\" style-hover=\"{{ hoverLight }}\">{{ saveSuiteName }} ▾<\u002Fbutton>\n                <span style=\"font:11.5px system-ui,sans-serif;color:rgba(28,25,20,.45)\">click to switch<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ templates }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"padding:6px 11px;border-radius:20px;border:1px solid rgba(28,25,20,.13);background:#fff;font:12px system-ui,sans-serif;color:rgba(28,25,20,.7);cursor:pointer\" style-hover=\"{{ hoverLight }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:12px;margin-top:2px\">\n              <div style=\"height:1px;flex:1;background:rgba(28,25,20,.1)\"><\u002Fdiv>\n              <span style=\"font:11px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.38);text-align:center\">OR RUN WHAT YOU ALREADY HAVE<\u002Fspan>\n              <div style=\"height:1px;flex:1;background:rgba(28,25,20,.1)\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabIsExisting }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid rgba(28,25,20,.12);border-radius:14px;overflow:hidden\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid rgba(28,25,20,.08)\">\n                <span style=\"font:600 12.5px system-ui;flex:1;min-width:140px\">Pick cases in {{ crumbProject }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onPickAll }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:5px 10px;font:11.5px system-ui;cursor:pointer\">Select all<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onPickNone }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:5px 10px;font:11.5px system-ui;cursor:pointer\">Select none<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onRunPicked }}\" style=\"{{ runPickedStyle }}\">▸ Run {{ pickedCount }} selected<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ pickRows }}\" as=\"c\" hint-placeholder-count=\"6\">\n                <div sc-camel-on-click=\"{{ c.onToggle }}\" style=\"{{ c.rowStyle }}\" style-hover=\"{{ hoverRow }}\">\n                  <span style=\"{{ c.boxStyle }}\">{{ c.check }}<\u002Fspan>\n                  <span style=\"{{ c.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font:12.5px system-ui,sans-serif;flex:1;min-width:0\">{{ c.title }}<\u002Fspan>\n                  <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.4);flex:none\">{{ c.suite }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n            <div style=\"font:600 13px system-ui,sans-serif\">Suites in {{ crumbProject }}<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <button sc-camel-on-click=\"{{ onNewSuite }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#fff;border-radius:8px;padding:7px 11px;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">+ New suite<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onRunAll }}\" style=\"border:none;border-radius:8px;padding:7px 12px;background:#221f1a;color:#faf9f5;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverDark }}\">▸ Run all {{ projectCaseCount }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ suiteRows }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:13px 16px;background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:11px\">\n                <div style=\"flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"font:500 13px system-ui,sans-serif\">{{ s.name }}<\u002Fspan>\n                    <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.42)\">{{ s.count }} cases<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:2px;height:4px\">\n                    <span style=\"{{ s.barPass }}\"><\u002Fspan>\n                    <span style=\"{{ s.barFail }}\"><\u002Fspan>\n                    <span style=\"{{ s.barRest }}\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font:11px system-ui,sans-serif;color:rgba(28,25,20,.5)\">{{ s.meta }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:8px;flex:none\">\n                  <button sc-camel-on-click=\"{{ s.onOpen }}\" style=\"padding:7px 12px;border-radius:8px;border:1px solid rgba(28,25,20,.14);background:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Open<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ s.onRun }}\" style=\"padding:7px 13px;border-radius:8px;border:none;background:#221f1a;color:#faf9f5;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverDark }}\">▸ Run suite<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ---------- SUITE ---------- -->\n      <sc-if value=\"{{ isSuite }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ wideStyle }}\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px\">\n            <div style=\"flex:1;min-width:240px\">\n              <div style=\"font:11px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.45);margin-bottom:7px\">TEST SUITE<\u002Fdiv>\n              <input value=\"{{ suiteName }}\" sc-camel-on-change=\"{{ onRenameSuite }}\" style=\"width:100%;max-width:520px;border:1px solid transparent;background:transparent;font:400 27px/1.2 'Newsreader',Georgia,serif;padding:2px 6px;margin-left:-6px;border-radius:7px\">\n              <div style=\"font:12.5px system-ui,sans-serif;color:rgba(28,25,20,.55);margin-top:6px\">{{ suiteMeta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <button sc-camel-on-click=\"{{ onNewCase }}\" style=\"padding:8px 12px;border-radius:8px;border:1px solid rgba(28,25,20,.14);background:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">+ New case<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onDupSuite }}\" style=\"padding:8px 12px;border-radius:8px;border:1px solid rgba(28,25,20,.14);background:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Duplicate suite<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onRunSelectedSuite }}\" style=\"{{ runSelSuiteStyle }}\">▸ Run {{ suiteSelCount }} selected<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onRunSuiteAll }}\" style=\"padding:8px 13px;border-radius:8px;border:none;background:#221f1a;color:#faf9f5;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverDark }}\">▸ Run all<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;overflow:hidden\">\n            <sc-for list=\"{{ caseRows }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid rgba(28,25,20,.07)\">\n                <span sc-camel-on-click=\"{{ c.onToggle }}\" style=\"{{ c.boxStyle }}\">{{ c.check }}<\u002Fspan>\n                <div sc-camel-on-click=\"{{ c.onOpen }}\" style=\"flex:1;min-width:220px;cursor:pointer\">\n                  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:4px\">\n                    <span style=\"{{ c.pillStyle }}\">{{ c.status }}<\u002Fspan>\n                    <span style=\"font:500 13px system-ui,sans-serif\">{{ c.title }}<\u002Fspan>\n                    <span style=\"font:10px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.4)\">{{ c.version }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:11.5px/1.5 system-ui,sans-serif;color:rgba(28,25,20,.55);max-width:640px;text-wrap:pretty\">{{ c.why }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:7px;flex:none\">\n                  <button sc-camel-on-click=\"{{ c.onRun }}\" style=\"padding:6px 11px;border-radius:7px;border:1px solid rgba(28,25,20,.14);background:#faf9f5;font:11.5px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">▸ Run<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ c.onOpen }}\" style=\"padding:6px 11px;border-radius:7px;border:1px solid rgba(28,25,20,.14);background:#faf9f5;font:11.5px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Edit<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ c.onDup }}\" style=\"padding:6px 11px;border-radius:7px;border:1px solid rgba(28,25,20,.14);background:#faf9f5;font:11.5px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Duplicate<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ c.onDel }}\" style=\"padding:6px 10px;border-radius:7px;border:1px solid rgba(28,25,20,.14);background:#faf9f5;font:11.5px system-ui;color:#a8402c;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Delete<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ suiteEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:34px 16px;text-align:center;font:13px system-ui;color:rgba(28,25,20,.5)\">No cases in this suite yet. Add one, or describe a test on the home screen and save it here.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ---------- CASE ---------- -->\n      <sc-if value=\"{{ isCase }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ wideStyle }}\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px\">\n            <div style=\"flex:1;min-width:260px\">\n              <div style=\"font:11px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.45);margin-bottom:7px\">{{ caseCrumb }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap\">\n                <span style=\"{{ casePillStyle }}\">{{ caseStatus }}<\u002Fspan>\n                <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.45)\">{{ caseVersionLabel }}<\u002Fspan>\n                <sc-if value=\"{{ dirty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"padding:2px 7px;border-radius:20px;background:rgba(176,138,38,.14);color:#7d6118;font:600 9.5px 'JetBrains Mono',ui-monospace,monospace\">UNSAVED<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <input value=\"{{ caseTitle }}\" sc-camel-on-change=\"{{ onRenameCase }}\" style=\"width:100%;max-width:620px;border:1px solid transparent;background:transparent;font:400 26px/1.2 'Newsreader',Georgia,serif;padding:2px 6px;margin-left:-6px;border-radius:7px\">\n              <div style=\"font:12.5px/1.6 system-ui,sans-serif;color:rgba(28,25,20,.6);margin-top:8px;max-width:640px;text-wrap:pretty\">{{ caseWhy }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <button sc-camel-on-click=\"{{ onSaveCase }}\" style=\"{{ saveBtnStyle }}\">Save<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onDupCase }}\" style=\"padding:8px 12px;border-radius:8px;border:1px solid rgba(28,25,20,.14);background:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Duplicate<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onCompareLatest }}\" style=\"padding:8px 12px;border-radius:8px;border:1px solid rgba(28,25,20,.14);background:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">Compare versions<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onRunCase }}\" style=\"padding:8px 13px;border-radius:8px;border:none;background:#b4552d;color:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverAccent }}\">▸ Run case<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:20px;border-bottom:1px solid rgba(28,25,20,.1)\">\n            <button sc-camel-on-click=\"{{ onCaseTabSteps }}\" style=\"{{ tabStepsStyle }}\">Steps<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onCaseTabScript }}\" style=\"{{ tabScriptStyle }}\">Script<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onCaseTabRuns }}\" style=\"{{ tabRunsStyle }}\">Runs &amp; versions<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ caseTabSteps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n              <div style=\"flex:1;min-width:300px;background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;padding:16px\">\n                <div style=\"font:600 11.5px system-ui;margin-bottom:12px\">Steps — edit in plain English<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ stepRows }}\" as=\"st\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:center;gap:9px\">\n                      <span style=\"width:20px;flex:none;font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.4)\">{{ st.num }}<\u002Fspan>\n                      <input value=\"{{ st.value }}\" sc-camel-on-change=\"{{ st.onChange }}\" style=\"flex:1;min-width:0;height:33px;border:1px solid rgba(28,25,20,.13);border-radius:8px;padding:0 10px;font:12.5px system-ui;background:#faf9f5\">\n                      <button sc-camel-on-click=\"{{ st.onUp }}\" title=\"Move up\" style=\"width:28px;height:28px;flex:none;border:1px solid rgba(28,25,20,.12);background:#fff;border-radius:7px;font:11px;cursor:pointer\">↑<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ st.onDown }}\" title=\"Move down\" style=\"width:28px;height:28px;flex:none;border:1px solid rgba(28,25,20,.12);background:#fff;border-radius:7px;font:11px;cursor:pointer\">↓<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ st.onDel }}\" title=\"Remove\" style=\"width:28px;height:28px;flex:none;border:1px solid rgba(28,25,20,.12);background:#fff;border-radius:7px;font:12px;color:#a8402c;cursor:pointer\">×<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ onAddStep }}\" style=\"margin-top:12px;border:1px dashed rgba(28,25,20,.22);background:transparent;border-radius:8px;padding:8px 12px;font:12px system-ui;color:rgba(28,25,20,.6);cursor:pointer;width:100%\">+ Add step<\u002Fbutton>\n                <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid rgba(28,25,20,.08)\">\n                  <div style=\"font:600 11.5px system-ui;margin-bottom:8px\">Expected outcome<\u002Fdiv>\n                  <input value=\"{{ caseExpected }}\" sc-camel-on-change=\"{{ onExpected }}\" style=\"width:100%;height:33px;border:1px solid rgba(28,25,20,.13);border-radius:8px;padding:0 10px;font:12.5px system-ui;background:#faf9f5\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"width:320px;flex:1 1 280px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"background:#f7f5ef;border:1px solid rgba(28,25,20,.1);border-radius:12px;padding:14px\">\n                  <div style=\"font:600 11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.07em;color:rgba(28,25,20,.5);margin-bottom:9px\">ASK FOR A CHANGE<\u002Fdiv>\n                  <textarea value=\"{{ askText }}\" sc-camel-on-change=\"{{ onAskText }}\" placeholder=\"also assert the order total is unchanged\" style=\"width:100%;min-height:62px;border:1px solid rgba(28,25,20,.13);border-radius:8px;padding:9px 10px;font:12.5px/1.5 system-ui;background:#fff;resize:vertical\"><\u002Ftextarea>\n                  <button sc-camel-on-click=\"{{ onAskApply }}\" style=\"margin-top:9px;width:100%;height:32px;border:none;border-radius:8px;background:#221f1a;color:#faf9f5;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverDark }}\">Rewrite steps<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;padding:14px\">\n                  <div style=\"font:600 11.5px system-ui;margin-bottom:8px\">Latest result<\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\">\n                    <span style=\"{{ casePillStyle }}\">{{ caseStatus }}<\u002Fspan>\n                    <span style=\"font:11.5px system-ui;color:rgba(28,25,20,.55)\">{{ caseLastRunMeta }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ onShotCase }}\" style=\"height:128px;border-radius:9px;background:repeating-linear-gradient(135deg,#eae7dd 0 7px,#f3f1e9 7px 14px);border:1px solid rgba(28,25,20,.12);display:flex;align-items:flex-end;padding:9px;cursor:zoom-in\">\n                    <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.5);background:rgba(255,255,255,.8);padding:3px 7px;border-radius:5px\">{{ caseShotLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ caseTabScript }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;overflow:hidden\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid rgba(28,25,20,.08);background:#f7f5ef\">\n                <span style=\"font:11.5px 'JetBrains Mono',ui-monospace,monospace;flex:1;min-width:160px\">generated.spec.ts<\u002Fspan>\n                <button sc-camel-on-click=\"{{ onCopyScript }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#fff;border-radius:7px;padding:5px 10px;font:11.5px system-ui;cursor:pointer\">Copy<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onDownloadScript }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#fff;border-radius:7px;padding:5px 10px;font:11.5px system-ui;cursor:pointer\">Download .spec.ts<\u002Fbutton>\n              <\u002Fdiv>\n              <pre style=\"margin:0;padding:16px 18px;overflow-x:auto;font:12.5px/1.85 'JetBrains Mono',ui-monospace,Menlo,monospace;color:#221f1a;white-space:pre\">{{ scriptText }}<\u002Fpre>\n              <div style=\"padding:11px 15px;border-top:1px solid rgba(28,25,20,.08);font:11.5px system-ui;color:rgba(28,25,20,.5)\">Generated from the steps above. Edit the steps and press Save to cut a new version.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ caseTabRuns }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start\">\n              <div style=\"flex:1;min-width:320px;background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;overflow:hidden\">\n                <div style=\"padding:12px 15px;border-bottom:1px solid rgba(28,25,20,.08);font:600 11.5px system-ui\">Previous runs<\u002Fdiv>\n                <sc-for list=\"{{ caseRunRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid rgba(28,25,20,.06)\">\n                    <span style=\"{{ r.pillStyle }}\">{{ r.status }}<\u002Fspan>\n                    <span style=\"font:12px system-ui;flex:1;min-width:120px\">{{ r.label }}<\u002Fspan>\n                    <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.45)\">{{ r.meta }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ r.onCompare }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:5px 9px;font:11px system-ui;cursor:pointer\">Compare<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"width:340px;flex:1 1 300px;background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;overflow:hidden\">\n                <div style=\"padding:12px 15px;border-bottom:1px solid rgba(28,25,20,.08);font:600 11.5px system-ui\">Versions<\u002Fdiv>\n                <sc-for list=\"{{ versionRows }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <div style=\"padding:11px 15px;border-bottom:1px solid rgba(28,25,20,.06);display:flex;flex-direction:column;gap:6px\">\n                    <div style=\"display:flex;align-items:center;gap:9px\">\n                      <span style=\"font:600 11px 'JetBrains Mono',ui-monospace,monospace\">{{ v.label }}<\u002Fspan>\n                      <span style=\"{{ v.pillStyle }}\">{{ v.status }}<\u002Fspan>\n                      <span style=\"margin-left:auto;font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.45)\">{{ v.ts }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font:11.5px/1.5 system-ui;color:rgba(28,25,20,.55)\">{{ v.note }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:7px\">\n                      <button sc-camel-on-click=\"{{ v.onCompare }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:5px 9px;font:11px system-ui;cursor:pointer\">Compare with current<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ v.onRestore }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:5px 9px;font:11px system-ui;cursor:pointer\">Restore<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ---------- RUN ---------- -->\n      <sc-if value=\"{{ isRun }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ wideStyle }}\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px\">\n            <div style=\"flex:1;min-width:240px\">\n              <div style=\"font:11px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.45);margin-bottom:7px\">{{ runScopeLabel }}<\u002Fdiv>\n              <h1 style=\"margin:0 0 7px;font:400 25px/1.25 'Newsreader',Georgia,serif;max-width:660px\">{{ runLabel }}<\u002Fh1>\n              <div style=\"font:12px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.5)\">{{ runMeta }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ onBackHome }}\" style=\"padding:8px 12px;border-radius:8px;border:1px solid rgba(28,25,20,.14);background:#fff;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverLight }}\">New run<\u002Fbutton>\n              <sc-if value=\"{{ runDone }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ onRunAgain }}\" style=\"padding:8px 13px;border-radius:8px;border:none;background:#221f1a;color:#faf9f5;font:500 12px system-ui;cursor:pointer\" style-hover=\"{{ hoverDark }}\">▸ Run again<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ runActive }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ onCancelRun }}\" style=\"padding:8px 12px;border-radius:8px;border:1px solid rgba(168,64,44,.35);background:#fff;color:#a8402c;font:500 12px system-ui;cursor:pointer\">Stop run<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"{{ p.cardStyle }}\">\n                <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n                  <span style=\"{{ p.dotStyle }}\">{{ p.glyph }}<\u002Fspan>\n                  <span style=\"font:500 12px system-ui;flex:1\">{{ p.label }}<\u002Fspan>\n                  <span style=\"{{ p.badgeStyle }}\">{{ p.badge }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font:11.5px/1.5 system-ui;color:rgba(28,25,20,.55);text-wrap:pretty\">{{ p.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ gateOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid rgba(180,85,45,.4);border-radius:13px;overflow:hidden;animation:fadeUp .2s ease-out\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;background:#fdf6f1;border-bottom:1px solid rgba(180,85,45,.2)\">\n                <span style=\"font:600 12.5px system-ui;flex:1;min-width:180px\">Review the test cases before we run them<\u002Fspan>\n                <span style=\"font:10.5px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.5)\">{{ gateMeta }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ gateItems }}\" as=\"g\" hint-placeholder-count=\"5\">\n                <div sc-camel-on-click=\"{{ g.onToggle }}\" style=\"{{ g.rowStyle }}\" style-hover=\"{{ hoverRow }}\">\n                  <span style=\"{{ g.boxStyle }}\">{{ g.check }}<\u002Fspan>\n                  <div style=\"flex:1;min-width:200px\">\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:3px\">\n                      <span style=\"font:500 12.5px system-ui\">{{ g.title }}<\u002Fspan>\n                      <sc-if value=\"{{ g.primary }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"padding:2px 7px;border-radius:20px;background:rgba(180,85,45,.13);color:#8d3f1f;font:600 9.5px 'JetBrains Mono',ui-monospace,monospace\">PRIMARY<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font:11.5px/1.5 system-ui;color:rgba(28,25,20,.55);text-wrap:pretty\">{{ g.why }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:13px 16px;border-top:1px solid rgba(28,25,20,.08)\">\n                <button sc-camel-on-click=\"{{ onGateAll }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:6px 10px;font:11.5px system-ui;cursor:pointer\">Select all<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onGateNone }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:6px 10px;font:11.5px system-ui;cursor:pointer\">Select none<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onRefineToggle }}\" style=\"border:1px solid rgba(28,25,20,.14);background:#faf9f5;border-radius:7px;padding:6px 10px;font:11.5px system-ui;cursor:pointer\">Not satisfied — refine<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ onGateRun }}\" style=\"{{ gateRunStyle }}\">▸ Run {{ gateCount }} tests<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ refineOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:13px 16px;border-top:1px solid rgba(28,25,20,.08);background:#f7f5ef\">\n                  <textarea value=\"{{ refineText }}\" sc-camel-on-change=\"{{ onRefineText }}\" placeholder=\"Tell the AI what to change — e.g. add edge cases for expired and already-used codes\" style=\"width:100%;min-height:60px;border:1px solid rgba(28,25,20,.14);border-radius:8px;padding:9px 10px;font:12.5px/1.5 system-ui;resize:vertical\"><\u002Ftextarea>\n                  <button sc-camel-on-click=\"{{ onRefineConfirm }}\" style=\"margin-top:9px;border:none;border-radius:8px;background:#221f1a;color:#faf9f5;padding:8px 13px;font:500 12px system-ui;cursor:pointer\">Confirm refine<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ progressOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:13px;overflow:hidden\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid rgba(28,25,20,.08)\">\n                <span style=\"font:600 12px system-ui;flex:1;min-width:140px\">{{ progressTitle }}<\u002Fspan>\n                <span style=\"font:11px 'JetBrains Mono',ui-monospace,monospace;color:rgba(28,25,20,.5)\">{{ progressMeta }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:12px 16px 6px;display:flex;gap:2px;height:5px\">\n                <span style=\"{{ barPass }}\"><\u002Fspan>\n                <span style=\"{{ barFail }}\"><\u002Fspan>\n                <span style=\"{{ barRest }}\"><\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ progressRows }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid rgba(28,25,20,.05)\">\n                  <span style=\"{{ c.dotStyle }}\"><\u002Fspan>\n                  <span style=\"font:12px system-ui;flex:1;min-width:0\">{{ c.title }}<\u002Fspan>\n                  <span style=\"{{ c.pillStyle }}\">{{ c.status }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ verdictOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ verdictStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:7px\">\n                <span style=\"{{ verdictIconStyle }}\">{{ verdictIcon }}<\u002Fspan>\n                <span style=\"font:600 15px system-ui;flex:1\">{{ verdictHead }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font:12.5px/1.6 system-ui;color:rgba(28,25,20,.65);max-width:720px;text-wrap:pretty\">{{ verdictDetail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ resultsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <div style=\"font:600 13px system-ui\">Results<\u002Fdiv>\n              <sc-for list=\"{{ resultRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"background:#fff;border:1px solid rgba(28,25,20,.11);border-radius:12px;overflow:hidden\">\n                  <div sc-camel-on-click=\"{{ r.onToggle }}\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:11px;padding:13px 16px;cursor:pointer\" style-hover=\"{{ hoverRow }}\">\n                    <span style=\"{{ r.pillStyle }}\">{{ r.status }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:200px\">\n                      <div style=\"font:500 13px system-ui;margin-bottom:3px\">{{ r.title }}<\u002Fdiv>\n                      <div style=\"font:11.5px/1.5 system-ui;color:rgba(28,25,20,.55);text-wrap:pretty\">{{ r.why }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font:12px;color:rgba(28,25,20,.4);flex:none\">{{ r.chevron }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:16px\">\n                      <div style=\"flex:1;min-width:260px;display:flex;flex-direction:column;gap:11px\">\n                        <div>\n                          <div style=\"font:600 11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.07em;color:rgba(28,25,20,.5);margin-bottom:6px\">WHAT HAPPENED<\u002Fdiv>\n                          <div style=\"font:12.5px/1.65 system-u 25,20,.09);display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:#f7f5ef\">\n                <span style=\"font:600 11px 'JetBrains Mono',ui-monospace,monospace\">{{ cmpALabel }}<\u002Fspan>\n                <span style=\"{{ cmpAPill }}\">{{ cmpAStatus }}<\u002Fspan>\n                <span style=\"margin-left:auto;font:11px system-ui;color:rgba(28,25,20,.5)\">{{ cmpATs }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:12px 8px\">\n                <sc-for list=\"{{ cmpASteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ s.style }}\">{{ s.text }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:300px;background:#fff;border:1px solid rgba(28,25,20,.12);border-radius:12px;overflow:hidden\">\n              <div style=\"padding:11px 14px;border-bottom:1px solid rgba(28,25,20,.09);display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:#f7f5ef\">\n                <span style=\"font:600 11px 'JetBrains Mono',ui-monospace,monospace\">{{ cmpBLabel }}<\u002Fspan>\n                <span style=\"{{ cmpBPill }}\">{{ cmpBStatus }}<\u002Fspan>\n                <span style=\"margin-left:auto;font:11px system-ui;color:rgba(28,25,20,.5)\">{{ cmpBTs }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:12px 8px\">\n                <sc-for list=\"{{ cmpBSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ s.style }}\">{{ s.text }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n            <div sc-camel-on-click=\"{{ onShotA }}\" style=\"flex:1;min-width:260px;height:190px;border-radius:11px;background:repeating-linear-gradient(135deg,#eae7dd 0 7px,#f3f1e9 7px 14px);border:1px solid rgba(28,25,20,.12);display:flex;align-items:fl
