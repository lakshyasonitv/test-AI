<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#0b63ce"/></marker></defs>
  <rect width="1000" height="820" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#0b3a78">The two data shapes everything else is built on</text>
  <text x="40" y="65" font-size="14" fill="#5a6b80">Both are Zod schemas in src/schema/. If you understand these two objects you can read any artifact in runs/.</text>

  <!-- AppModel -->
  <rect x="40" y="88" width="450" height="404" rx="8" fill="#f7f9fc" stroke="#0b63ce" stroke-width="2"/>
  <rect x="40" y="88" width="450" height="42" rx="8" fill="#0b63ce"/>
  <text x="60" y="116" font-size="17" font-weight="700" fill="#ffffff">AppModel</text>
  <text x="290" y="116" font-size="12" fill="#cfe2fb">what the site HAS  ·  02-appmodel.json</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#1a2f4b">
    <text x="60" y="154">{</text>
    <text x="60" y="176">  baseUrl: string</text>
    <text x="60" y="198">  pages: PageModel[]</text>
    <text x="60" y="220">  auth?: {</text>
    <text x="60" y="240">    status: "no-gate" | "no-credentials"</text>
    <text x="60" y="258">          | "login-failed" | "authenticated"</text>
    <text x="60" y="278">    loginUrl?  <tspan font-family="Segoe UI, Arial" fill="#6b7280">the gate page</tspan></text>
    <text x="60" y="296">    url?       <tspan font-family="Segoe UI, Arial" fill="#6b7280">where login LANDED</tspan></text>
    <text x="60" y="314">    loginSteps?: AuthStep[]</text>
    <text x="60" y="332">  }</text>
    <text x="60" y="350">}</text>
  </g>
  <line x1="60" y1="362" x2="470" y2="362" stroke="#c9d9ee"/>
  <text x="60" y="382" font-size="13" font-weight="700" fill="#0b3a78">PageModel — one per crawled page</text>
  <g font-family="Consolas, monospace" font-size="12.5" fill="#1a2f4b">
    <text x="60" y="402">  url, title, concepts[]  <tspan font-family="Segoe UI, Arial" fill="#6b7280">"Login", "Search"</tspan></text>
    <text x="60" y="421">  elements: Element[]     <tspan font-family="Segoe UI, Arial" fill="#6b7280">the important bit</tspan></text>
    <text x="60" y="440">  forms, navigation, domLinks, buttons,</text>
    <text x="60" y="459">  headings, tables, images, …</text>
    <text x="60" y="480">  discoveryMethod: "dom" | "vision" | "hybrid"</text>
  </g>

  <!-- Element detail -->
  <rect x="40" y="504" width="450" height="196" rx="8" fill="#f7f9fc" stroke="#c9d9ee"/>
  <text x="60" y="528" font-size="14" font-weight="700" fill="#0b3a78">Element — the unit grounding checks against</text>
  <g font-family="Consolas, monospace" font-size="12.5" fill="#1a2f4b">
    <text x="60" y="550">  role     <tspan font-family="Segoe UI, Arial" fill="#6b7280">required — "button", "textbox"…</tspan></text>
    <text x="60" y="570">  name     <tspan font-family="Segoe UI, Arial" fill="#6b7280">required — the ACCESSIBLE name</tspan></text>
    <text x="60" y="590">  css      <tspan font-family="Segoe UI, Arial" fill="#6b7280">written by code, never by the model</tspan></text>
    <text x="60" y="610">  testId, id, visible, enabled</text>
    <text x="60" y="630">  nameFromProximity</text>
  </g>
  <rect x="58" y="642" width="414" height="48" rx="5" fill="#fff4f4" stroke="#e0b4b4"/>
  <text x="72" y="660" font-size="12" font-weight="700" fill="#9c2a2a">If nameFromProximity is true…</text>
  <text x="72" y="678" font-size="12" fill="#374151">…the name came from nearby text, not the element.</text>

  <!-- IR -->
  <rect x="520" y="88" width="440" height="404" rx="8" fill="#f7f9fc" stroke="#3d8a52" stroke-width="2"/>
  <rect x="520" y="88" width="440" height="42" rx="8" fill="#3d8a52"/>
  <text x="540" y="116" font-size="17" font-weight="700" fill="#ffffff">IR</text>
  <text x="700" y="116" font-size="12" fill="#d8ecdd">what the test DOES  ·  04-ir.json</text>

  <g font-family="Consolas, monospace" font-size="13" fill="#1a2f4b">
    <text x="540" y="154">{</text>
    <text x="540" y="176">  meta: {</text>
    <text x="540" y="196">    feature, title, priority,</text>
    <text x="540" y="216">    sourcePrompt, baseUrl,</text>
    <text x="540" y="236">    truncated?          <tspan font-family="Segoe UI, Arial" fill="#9c2a2a">← check this</tspan></text>
    <text x="540" y="256">    truncationNote?     <tspan font-family="Segoe UI, Arial" fill="#9c2a2a">← says why</tspan></text>
    <text x="540" y="276">    hasTerminalAssertion?</text>
    <text x="540" y="296">  }</text>
    <text x="540" y="318">  steps: Step[]   <tspan font-family="Segoe UI, Arial" fill="#6b7280">at least 1</tspan></text>
    <text x="540" y="338">}</text>
  </g>
  <line x1="540" y1="352" x2="940" y2="352" stroke="#c9d9ee"/>
  <text x="540" y="372" font-size="13" font-weight="700" fill="#0b3a78">Step</text>
  <g font-family="Consolas, monospace" font-size="12.5" fill="#1a2f4b">
    <text x="540" y="392">  id: "s1"</text>
    <text x="540" y="412">  action: navigate | click | fill | select</text>
    <text x="540" y="430">        | check | press | wait | assert</text>
    <text x="540" y="450">  target?: Target</text>
    <text x="540" y="470">  value?, assertion?, preAction?</text>
  </g>

  <rect x="520" y="504" width="440" height="196" rx="8" fill="#f7f9fc" stroke="#c9d9ee"/>
  <text x="540" y="528" font-size="14" font-weight="700" fill="#0b3a78">Target — how a step finds an element</text>
  <g font-family="Consolas, monospace" font-size="12.5" fill="#1a2f4b">
    <text x="540" y="550">  role + name   <tspan font-family="Segoe UI, Arial" fill="#6b7280">preferred</tspan></text>
    <text x="540" y="570">  nth           <tspan font-family="Segoe UI, Arial" fill="#6b7280">0-indexed, for duplicates</tspan></text>
    <text x="540" y="590">  css           <tspan font-family="Segoe UI, Arial" fill="#6b7280">added by grounding</tspan></text>
    <text x="540" y="610">  label, text, placeholder, testId, url</text>
  </g>
  <rect x="538" y="628" width="404" height="60" rx="5" fill="#fff8e8" stroke="#d98b1f"/>
  <text x="552" y="646" font-size="12" font-weight="700" fill="#8a5a10">Three assertions take NO target</text>
  <text x="552" y="664" font-size="12" fill="#374151">url_contains, title_contains, title_equals —</text>
  <text x="552" y="681" font-size="12" fill="#374151">their comparison value lives in step.value.</text>

  <!-- relationship -->
  <rect x="40" y="716" width="920" height="86" rx="8" fill="#e8f1fc" stroke="#0b63ce"/>
  <text x="58" y="740" font-size="15" font-weight="700" fill="#0b3a78">How they relate — this is the whole idea of the project</text>
  <text x="58" y="763" font-size="13" fill="#374151">The model writes an IR. Then <tspan font-family="Consolas, monospace">groundingError(ir, appModel)</tspan> walks every step and asks: does this Target actually exist in the AppModel?</text>
  <text x="58" y="784" font-size="13" fill="#374151">If yes, it writes the real <tspan font-family="Consolas, monospace">css</tspan> onto the Target. If no, the IR is rejected and regenerated. <tspan font-weight="700">The model proposes; code verifies.</tspan></text>
</svg>
