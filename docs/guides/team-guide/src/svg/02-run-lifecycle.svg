<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#0b63ce"/></marker>
    <marker id="a2g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#3d8a52"/></marker>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>

  <text x="40" y="40" font-size="22" font-weight="700" fill="#0b3a78">What happens when you press Run</text>
  <text x="40" y="65" font-size="14" fill="#5a6b80">The key idea: the HTTP request returns in milliseconds. The actual work happens in the background and you watch it by polling.</text>

  <!-- lanes -->
  <rect x="40" y="90" width="270" height="620" rx="8" fill="#f7f9fc" stroke="#c9d9ee"/>
  <text x="175" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#0b3a78">Browser</text>
  <text x="175" y="133" text-anchor="middle" font-size="12" fill="#6b7280">public/app.js</text>

  <rect x="345" y="90" width="290" height="620" rx="8" fill="#f7f9fc" stroke="#c9d9ee"/>
  <text x="490" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#0b3a78">Express server</text>
  <text x="490" y="133" text-anchor="middle" font-size="12" fill="#6b7280">src/server/index.ts</text>

  <rect x="670" y="90" width="290" height="620" rx="8" fill="#f7f9fc" stroke="#c9d9ee"/>
  <text x="815" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#0b3a78">Background pipeline</text>
  <text x="815" y="133" text-anchor="middle" font-size="12" fill="#6b7280">src/orchestrator.ts</text>

  <g font-size="13">
    <!-- step 1 -->
    <rect x="58" y="152" width="234" height="52" rx="6" fill="#e8f1fc" stroke="#0b63ce"/>
    <text x="72" y="172" font-weight="700" fill="#0b3a78">1. You submit the form</text>
    <text x="72" y="192" fill="#374151">prompt + url + coverage</text>
    <line x1="292" y1="178" x2="356" y2="178" stroke="#0b63ce" stroke-width="2" marker-end="url(#a2)"/>
    <text x="324" y="170" text-anchor="middle" font-size="11" fill="#0b63ce">POST</text>

    <rect x="360" y="152" width="260" height="76" rx="6" fill="#e8f1fc" stroke="#0b63ce"/>
    <text x="374" y="172" font-weight="700" fill="#0b3a78">2. POST /api/runs</text>
    <text x="374" y="191" fill="#374151">checks your role (tester+)</text>
    <text x="374" y="208" fill="#374151">makes the runId up front</text>
    <text x="374" y="223" font-size="11" fill="#6b7280">only gateReview + selfHeal are forwarded</text>

    <line x1="292" y1="250" x2="356" y2="250" stroke="#3d8a52" stroke-width="2" marker-end="url(#a2g)" stroke-dasharray="0"/>
    <text x="324" y="243" text-anchor="middle" font-size="11" fill="#3d8a52">202</text>
    <rect x="58" y="228" width="234" height="46" rx="6" fill="#dff0e2" stroke="#3d8a52"/>
    <text x="72" y="248" font-weight="700" fill="#1f5130">3. Gets { runId } back</text>
    <text x="72" y="266" fill="#374151">immediately — nothing has run</text>

    <!-- to pipeline -->
    <line x1="620" y1="200" x2="684" y2="200" stroke="#0b63ce" stroke-width="2" marker-end="url(#a2)"/>
    <rect x="688" y="152" width="256" height="96" rx="6" fill="#fde8c8" stroke="#d98b1f"/>
    <text x="702" y="172" font-weight="700" fill="#0b3a78">4. runLimit.run(...)</text>
    <text x="702" y="191" fill="#374151">Semaphore, max 3 at once</text>
    <text x="702" y="209" fill="#374151">(each run opens a Chromium)</text>
    <text x="702" y="228" fill="#9c2a2a">Over the cap? It queues.</text>
    <text x="702" y="243" font-size="11" fill="#6b7280">MAX_CONCURRENT_RUNS</text>

    <rect x="688" y="264" width="256" height="86" rx="6" fill="#fff" stroke="#c9d9ee"/>
    <text x="702" y="284" font-weight="700" fill="#0b3a78">5. The 7 stages run</text>
    <text x="702" y="303" fill="#374151">each one emits an event:</text>
    <text x="702" y="321" font-family="Consolas, monospace" font-size="11" fill="#374151">store.append(event)  ← disk first</text>
    <text x="702" y="338" font-family="Consolas, monospace" font-size="11" fill="#374151">onEvent(event)       ← then live</text>

    <!-- polling -->
    <rect x="58" y="300" width="234" height="106" rx="6" fill="#e8f1fc" stroke="#0b63ce"/>
    <text x="72" y="320" font-weight="700" fill="#0b3a78">6. connectToRun(runId)</text>
    <text x="72" y="339" fill="#374151">polls every 1 second</text>
    <text x="72" y="357" font-family="Consolas, monospace" font-size="11" fill="#374151">GET /api/runs/:id/state</text>
    <text x="72" y="376" fill="#374151">replays events it has not</text>
    <text x="72" y="392" fill="#374151">seen into the phase cards</text>

    <line x1="292" y1="352" x2="356" y2="352" stroke="#0b63ce" stroke-width="2" marker-end="url(#a2)" stroke-dasharray="4 3"/>
    <line x1="356" y1="376" x2="292" y2="376" stroke="#3d8a52" stroke-width="2" marker-end="url(#a2g)" stroke-dasharray="4 3"/>
    <text x="324" y="370" text-anchor="middle" font-size="11" fill="#6b7280">×N</text>

    <rect x="360" y="330" width="260" height="72" rx="6" fill="#e8f1fc" stroke="#0b63ce"/>
    <text x="374" y="350" font-weight="700" fill="#0b3a78">GET .../state</text>
    <text x="374" y="369" fill="#374151">returns the whole event log</text>
    <text x="374" y="386" fill="#374151">read from events.ndjson</text>

    <!-- pauses -->
    <rect x="688" y="368" width="256" height="106" rx="6" fill="#fff4f4" stroke="#e0b4b4"/>
    <text x="702" y="388" font-weight="700" fill="#9c2a2a">The run can PAUSE here</text>
    <text x="702" y="407" fill="#374151">• credentials needed (5 min)</text>
    <text x="702" y="425" fill="#374151">• case-selection gate (10 min)</text>
    <text x="702" y="446" font-size="11" fill="#9c2a2a">A paused run still holds its slot.</text>
    <text x="702" y="462" font-size="11" fill="#9c2a2a">3 abandoned prompts wedge the server.</text>

    <line x1="292" y1="430" x2="356" y2="430" stroke="#0b63ce" stroke-width="2" marker-end="url(#a2)"/>
    <rect x="58" y="412" width="234" height="52" rx="6" fill="#fff4f4" stroke="#e0b4b4"/>
    <text x="72" y="432" font-weight="700" fill="#9c2a2a">7. You answer the modal</text>
    <text x="72" y="452" font-size="12" fill="#374151">POST .../credentials</text>

    <!-- done -->
    <rect x="688" y="492" width="256" height="66" rx="6" fill="#dff0e2" stroke="#3d8a52"/>
    <text x="702" y="512" font-weight="700" fill="#1f5130">8. emits done (or error)</text>
    <text x="702" y="531" fill="#374151">writes 07- and 08- artifacts</text>
    <text x="702" y="549" font-size="11" fill="#6b7280">status derived by summariseRun()</text>

    <line x1="686" y1="590" x2="622" y2="590" stroke="#3d8a52" stroke-width="2" marker-end="url(#a2g)"/>
    <rect x="360" y="566" width="260" height="52" rx="6" fill="#dff0e2" stroke="#3d8a52"/>
    <text x="374" y="586" font-weight="700" fill="#1f5130">recordRunStatus()</text>
    <text x="374" y="605" font-size="12" fill="#374151">fire-and-forget to Postgres</text>

    <line x1="356" y1="592" x2="292" y2="592" stroke="#3d8a52" stroke-width="2" marker-end="url(#a2g)"/>
    <rect x="58" y="566" width="234" height="52" rx="6" fill="#dff0e2" stroke="#3d8a52"/>
    <text x="72" y="586" font-weight="700" fill="#1f5130">9. Poll sees it is done</text>
    <text x="72" y="605" font-size="12" fill="#374151">stops, paints the verdict</text>
  </g>

  <rect x="40" y="636" width="920" height="66" rx="8" fill="#fff4f4" stroke="#e0b4b4"/>
  <text x="58" y="659" font-size="14" font-weight="700" fill="#9c2a2a">The thing people get wrong about this diagram</text>
  <text x="58" y="680" font-size="13" fill="#374151">There IS an SSE route (GET /api/runs/:id/events) — but no browser code ever calls it. EventSource appears nowhere in public/.</text>
  <text x="58" y="697" font-size="13" fill="#374151">The UI polls, because a Cloudflare tunnel buffers text/event-stream and only flushes when the connection closes, which SSE never does.</text>
</svg>
