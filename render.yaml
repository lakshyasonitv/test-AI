services:
  - type: web
    name: ai-test-platform
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: GEMINI_MODEL_LITE
        value: "gemini-1.5-flash"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: NODE_ENV
        value: "production"
