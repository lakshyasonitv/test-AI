<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Test Platform</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>AI Test Platform</h1>

    <div id="templates" class="templates"></div>

    <form id="runForm">
      <label>Prompt
        <textarea id="prompt" rows="2" placeholder="Test the login page with an invalid password"></textarea>
      </label>
      <label>URL
        <input id="url" type="url" placeholder="https://example.com/login" />
      </label>
      <button type="submit">Run</button>
    </form>

    <ol id="stages" class="stages"></ol>

    <!-- Suite progress (shown while suite is running) -->
    <section id="suiteProgress" class="suite-progress hidden">
      <h2>Running Suite</h2>
      <div id="suiteProgressList" class="suite-progress-list"></div>
    </section>

    <!-- Single-test backward-compatible result -->
    <section id="finalResult" class="hidden">
      <h2 id="verdict"></h2>
      <div id="testSummary" class="test-summary hidden">
        <h3 id="testTitle"></h3>
        <ol id="testSteps"></ol>
        <p id="testExpected"></p>
      </div>
      <figure id="screenshotFigure" class="hidden">
        <img id="screenshot" alt="result screenshot" />
        <figcaption>Final state at the end of the test</figcaption>
      </figure>
      <p id="diagnosis"></p>
      <a id="traceLink" class="hidden" target="_blank" href="#">View Generated Spec &amp; Artifacts</a>
    </section>
<!-- Needs-input form (shown when the pipeline pauses for login/signup data) -->
    <section id="needsInput" class="hidden">
      <h2 id="needsInputReason"></h2>
      <form id="credentialsForm">
        <label class="hidden" id="usernameLabel">
          <span id="usernameLabelText">Username / Email</span>
          <input id="credUsername" type="text" />
        </label>
        <label class="hidden" id="passwordLabel">
          Password
          <input id="credPassword" type="password" />
        </label>
        <label class="hidden" id="confirmPasswordLabel">
          Confirm Password
          <input id="credConfirmPassword" type="password" />
        </label>
        <button type="submit">Continue</button>
      </form>
    </section>
    
    <!-- Suite results -->
    <section id="suiteResults" class="suite-results hidden">
      <div id="suiteSummaryHeader" class="suite-summary-header"></div>
      <button id="screenshotToggle" class="screenshot-toggle hidden" type="button">View All Screenshots</button>
      <div id="screenshotGrid" class="screenshot-grid hidden"></div>
      <div id="suiteCaseList" class="suite-case-list"></div>
    </section>

    <section id="history">
      <h2>History</h2>
      <ul id="historyList" class="history-list"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
