<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Test Platform</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <h1>AI Test Platform</h1>

    <div id="templates" class="templates"></div>

    <form id="runForm">
      <label>Prompt
        <textarea id="prompt" rows="2" placeholder="Test the login page with an invalid password"></textarea>
      </label>
      <label>URL
        <input id="url" type="url" placeholder="https://example.com/login" />
      </label>
      <button type="submit">Run</button>
    </form>

    <ol id="stages" class="stages"></ol>

    <!-- Credential prompt: appears only when a run pauses because the site needs a login -->
    <section id="credentialPrompt" class="cred hidden" aria-live="polite">
      <div class="cred-head">
        <span class="cred-key" aria-hidden="true">&#128273;</span>
        <div>
          <h2>This site needs a login</h2>
          <p id="credWhy" class="cred-why"></p>
        </div>
      </div>
      <form id="credForm" class="cred-form">
        <div class="cred-fields">
          <label>Username or email
            <input id="credUser" type="text" autocomplete="off" spellcheck="false" />
          </label>
          <label>Password
            <input id="credPass" type="password" autocomplete="off" />
          </label>
        </div>
        <div class="cred-actions">
          <button type="submit">Use these</button>
          <button type="button" id="credSkip" class="cred-skip">Skip &mdash; test without logging in</button>
        </div>
        <p class="cred-note">
          Used for this run only. Never written to the run folder or the generated test &mdash;
          the test reads them from the environment at run time.
        </p>
      </form>
    </section>

    <!-- Suite progress (shown while suite is running) -->
    <section id="suiteProgress" class="suite-progress hidden">
      <h2>Running Suite</h2>
      <div id="suiteProgressList" class="suite-progress-list"></div>
    </section>

    <!-- Single-test backward-compatible result -->
    <section id="finalResult" class="hidden">
      <h2 id="verdict"></h2>
      <div id="testSummary" class="test-summary hidden">
        <h3 id="testTitle"></h3>
        <ol id="testSteps"></ol>
        <p id="testExpected"></p>
      </div>
      <figure id="screenshotFigure" class="hidden">
        <img id="screenshot" alt="result screenshot" />
        <figcaption>Final state at the end of the test</figcaption>
      </figure>
      <p id="diagnosis"></p>
      <a id="traceLink" class="hidden" target="_blank" href="#">View Generated Spec &amp; Artifacts</a>
    </section>

    <!-- Suite results -->
    <section id="suiteResults" class="suite-results hidden">
      <div id="suiteSummaryHeader" class="suite-summary-header"></div>
      <button id="screenshotToggle" class="screenshot-toggle hidden" type="button">View All Screenshots</button>
      <div id="screenshotGrid" class="screenshot-grid hidden"></div>
      <div id="suiteCaseList" class="suite-case-list"></div>
    </section>

    <section id="history">
      <h2>History</h2>
      <ul id="historyList" class="history-list"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
